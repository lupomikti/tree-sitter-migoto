;                  Help Menu
; ---------------------------------------------------------

; =======================================
; 1) Define the color/box parameters
; =======================================

[ResourceParamsFull]
type = StructuredBuffer
array = 1
data = R32_FLOAT   -0.9 -0.9 0.9 0.9    0.85 0.7 0.1 1.0   0.33 0.32 0.18 0.95  0.02 0.02    1 2   0   1.0

[ResourceParamsHalf]
type = StructuredBuffer
array = 1
data = R32_FLOAT   -0.9 -0.9 0.9 0.9    0.85 0.7 0.1 1.0   0.33 0.32 0.18 0.95  0.02 0.02    1 2   0   1.5

[ResourceParamsDouble]
type = StructuredBuffer
array = 1
data = R32_FLOAT   -0.9 -0.9 0.9 0.9    0.85 0.7 0.1 1.0   0.33 0.32 0.18 0.95  0.02 0.02    1 2   0   2.0

; =======================================
;    One for each combo of modes.
;    Each chunk of text is the entire help text.
; =======================================

; Lock Toggles=Disabled

[ResourceLT0]
type = buffer
format = R8_UINT
filename = HelpMenu/LT0.txt

; Lock Toggles=Enabled

[ResourceLT1]
type = buffer
format = R8_UINT
filename = HelpMenu/LT1.txt

[ResourcePopLockToggles0]
type = buffer
format = R8_UINT
filename = HelpMenu/popLockToggles0.txt

[ResourcePopLockToggles1]
type = buffer
format = R8_UINT
filename = HelpMenu/popLockToggles1.txt

; =======================================
; 	  CommandListHelp
;    This picks the correct resource
;    then draws it.
; =======================================

[CommandListHelpUpdate]
; If statements to load the correct resource
if $helpVisible == 1
    if $lock == 0
        post Resource\ShaderFixes\help.ini\Help = ref ResourceLT0
    endif

    if $lock == 1
        post Resource\ShaderFixes\help.ini\Help = ref ResourceLT1
    endif
else
    ; Small pop-up when switching modes
    if $detect_lock == 1
        if $lock == 0
            post Resource\ShaderFixes\help.ini\Help = ref ResourcePopLockToggles0
        else if $lock == 1
            post Resource\ShaderFixes\help.ini\Help = ref ResourcePopLockToggles1
        endif
    endif
    $detect_lock = 0
    $menuTimeout = TIME
    $menuOff = 0
endif

; Load the color/box parameters
if $helpScale == 1
    post Resource\ShaderFixes\help.ini\Params = ref ResourceParamsFull
else if $helpScale == 2
    post Resource\ShaderFixes\help.ini\Params = ref ResourceParamsDouble
else
    post Resource\ShaderFixes\help.ini\Params = ref ResourceParamsHalf
endif
post run = CustomShader\ShaderFixes\help.ini\FormatText

[CommandListHelp]
if $helpVisible == 0
    $helpVisible = 1
    pre run = CommandListHelpUpdate

    ; Setting short help to null to avoid auto-timeout
    pre Resource\ShaderFixes\help.ini\HelpShort = null

    ; Turn off help if toggled again
    post Resource\ShaderFixes\help.ini\Help = null
endif
