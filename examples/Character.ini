; CharacterSkin
namespace = Creator\Character\ModName

; Constants -------------------------

[Constants]
global $active = 0

; =======================================
; Variables
global persist $shoes = 0
global persist $innerskirt = 0
global persist $innerskirt_transparency = 0
global persist $backskirt = 0
global persist $backskirt_transparency = 0
global persist $dress = 0
global persist $hair = 0
global persist $skirt_color = 0
global persist $under_color = 0
global persist $top = 0
global persist $tail = 0

; =======================================
; Help Menu
global $helpVisible = 0
global persist $helpScale = 1
global $menuOff = 1
global $menuTimeout
global $detect_lock
global persist $lock = 0

[Present]
;Turns off menu when character is inactive
if $active == 0 && $helpVisible == 1
    post $helpVisible = 0
    run = CommandListHelp
endif

;Turns off small pop-up menu after set amount of time
if $menuOff == 0
    if TIME - $menuTimeout >= 1.2
        post $menuOff = 1
        post Resource\ShaderFixes\help.ini\Help = null
    endif
endif
post $active = 0

; ====================================================
; MENU KEYS

[KeySwapMenu]
key = ALT H
condition = $active == 1
type = cycle
$helpVisible = 0, 1
run = CommandListHelp

[KeySwapMenuScale]
key = ALT Y
condition = $active == 1
type = cycle
$helpScale = 1, 3, 2
run = CommandListHelpUpdate

; ====================================================
; VARIABLE KEYS

[KeySwapLockToggles]
key = VK_UP
condition = $active == 1
type = cycle
$lock = 0, 1
$detect_lock = 1
run = CommandListHelpUpdate

; ====================================================

[KeySwapShoes]
key = 5
condition = $active == 1 && $lock == 0
type = cycle
$shoes = 0, 1

[KeySwapInnerskirt]
key = no_ctrl 6
condition = $active == 1 && $lock == 0
type = cycle
$innerskirt = 0, 1, 2, 3, 4, 5, 6

[KeyInnerskirtTransparency]
key = ctrl 6
condition = $active == 1 && $lock == 0
type = cycle
$innerskirt_transparency = 0, 1

[KeySwapBackskirt]
key = no_ctrl 7
condition = $active == 1 && $lock == 0
type = cycle
$backskirt = 0, 1, 2, 3

[KeyBackskirtTransparency]
key = ctrl 7
condition = $active == 1 && $lock == 0
type = cycle
$backskirt_transparency = 0, 1

[KeySwapSkirtColor]
key = ctrl 8
condition = $active == 1 && $lock == 0
type = cycle
$skirt_color = 0, 1

[KeySwapDress]
key = no_ctrl 8
condition = $active == 1 && $lock == 0
type = cycle
$dress = 0, 1, 2

[KeySwapUnderColor]
key = ctrl 9
condition = $active == 1 && $lock == 0
type = cycle
$under_color = 0, 1, 2, 3

[KeySwapHair]
key = no_ctrl 9
condition = $active == 1 && $lock == 0
type = cycle
$hair = 0, 1, 2

[KeySwapTop]
key = no_modifiers 0
condition = $active == 1 && $lock == 0
type = cycle
$top = 0, 1

[KeySwapTail]
key = ctrl 0
condition = $active == 1 && $lock == 0
type = cycle
$tail = 0, 1

